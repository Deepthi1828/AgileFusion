<!DOCTYPE html>
<html>
<head>
    <title>AgileFusion - Reports</title>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            display: flex;
            background: #f4f6f9;
        }

        .sidebar {
            width: 230px;
            background: #111827;
            color: white;
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }

        .nav-link {
            padding: 14px 20px;
            text-decoration: none;
            color: #9ca3af;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-link:hover {
            background: #1f2937;
            color: white;
        }

        .nav-link.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 230px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 14px;
        }

        .logout-btn {
            padding: 6px 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .content {
            padding: 30px;
            max-width: 1200px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 18px;
            border-radius: 10px;
            color: white;
        }

        .blue { background: #2563eb; }
        .green { background: #16a34a; }
        .orange { background: #f59e0b; }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        canvas {
            max-height: 300px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="logo">🚀 AgileFusion</div>

    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="projects.html" class="nav-link">Projects</a>
    <a href="kanban.html" class="nav-link">Kanban</a>
    <a href="sprints.html" class="nav-link">Sprints</a>
    <a href="gantt.html" class="nav-link">Gantt</a>
    <a href="reports.html" class="nav-link active">Reports</a>
    <a href="team.html" class="nav-link">Team</a>
</div>

<div class="main">

    <div class="topbar">
        <div>Reports & Analytics</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="content">

        <div class="stats">
            <div class="stat-box blue">
                <h3>Total Revenue Impact</h3>
                <h2>$120K</h2>
            </div>
            <div class="stat-box green">
                <h3>Completion Rate</h3>
                <h2>78%</h2>
            </div>
            <div class="stat-box orange">
                <h3>Avg Sprint Velocity</h3>
                <h2>24 SP</h2>
            </div>
        </div>

        <div class="card">
            <h3>Project Performance Overview</h3>
            <canvas id="performanceChart"></canvas>
        </div>

    </div>
</div>

<script>
new Chart(document.getElementById("performanceChart"), {
    type: "line",
    data: {
        labels: ["Jan", "Feb", "Mar", "Apr"],
        datasets: [{
            label: "Completed Projects",
            data: [2, 4, 5, 7],
            borderColor: "#2563eb",
            fill: false,
            tension: 0.3
        }]
    }
});

function logout() {
    localStorage.removeItem("isLoggedIn");
    window.location.href = "index.html";
}
</script>

</body>
</html>
