<!DOCTYPE html>
<html>
<head>
    <title>AgileFusion - Dashboard</title>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f9;
        }
        .main-container{
            
            min-height: 100vh;
        }
    <body>
        <div class = "main-container">
                <div class = "sidebar">
            </div>
            <div class="main-content">
            </div>
        </div>
        </body>
        .main-content{
            margin-left: 230px;
            padding: 20px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 230px;
            background: #111827;
            color: white;
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f2937;
        }

        .nav-link {
            padding: 14px 20px;
            text-decoration: none;
            color: #9ca3af;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-link:hover {
            background: #1f2937;
            color: white;
        }

        .nav-link.active {
            background: #2563eb;
            color: white;
        }

        /* ===== MAIN ===== */
        .main {
            margin-left: 230px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 14px;
        }

        .logout-btn {
            padding: 6px 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .content {
            padding: 30px;
            max-width: 1200px;
        }

        /* ===== STATS ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 18px;
            border-radius: 10px;
            color: white;
        }

        .stat-box h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
        }

        .stat-box h2 {
            margin-top: 8px;
            font-size: 22px;
        }

        .blue { background: #2563eb; }
        .green { background: #16a34a; }
        .orange { background: #f59e0b; }
        .purple { background: #7c3aed; }

        /* ===== CARDS ===== */
        .card-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 15px;
        }

        canvas {
            max-height: 250px;
        }
    </style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
    <div class="logo">🚀 AgileFusion</div>

    <a href="dashboard.html" class="nav-link active">Dashboard</a>
    <a href="projects.html" class="nav-link">Projects</a>
    <a href="kanban.html" class="nav-link">Kanban</a>
    <a href="sprints.html" class="nav-link">Sprints</a>
    <a href="reports.html" class="nav-link">Reports</a>
</div>

<!-- ===== MAIN ===== -->
<div class="main">

    <div class="topbar">
        <div>Dashboard Overview</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="content">

        <!-- ===== STATS ===== -->
        <div class="stats">
            <div class="stat-box blue">
                <h3>Total Projects</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="stat-box green">
                <h3>Completed</h3>
                <h2 id="completed">0</h2>
            </div>

            <div class="stat-box orange">
                <h3>In Progress</h3>
                <h2 id="inProgress">0</h2>
            </div>

            <div class="stat-box purple">
                <h3>Planning</h3>
                <h2 id="planning">0</h2>
            </div>
        </div>

        <!-- ===== CHARTS ===== -->
        <div class="card-container">

            <div class="card">
                <h3>Project Status Distribution</h3>
                <canvas id="statusChart"></canvas>
            </div>

            <div class="card">
                <h3>Sprint Progress</h3>
                <canvas id="sprintChart"></canvas>
            </div>

        </div>

    </div>
</div>

<script>
async function loadDashboard() {
    const res = await fetch("/dashboardStats");
    const data = await res.json();

    document.getElementById("total").innerText = data.total;
    document.getElementById("completed").innerText = data.completed;
    document.getElementById("inProgress").innerText = data.inProgress;
    document.getElementById("planning").innerText = data.planning;

    new Chart(document.getElementById("statusChart"), {
        type: "bar",
        data: {
            labels: ["Completed", "In Progress", "Planning"],
            datasets: [{
                data: [data.completed, data.inProgress, data.planning],
                backgroundColor: ["#16a34a", "#f59e0b", "#7c3aed"]
            }]
        },
        options: {
            plugins: { legend: { display: false } }
        }
    });

    new Chart(document.getElementById("sprintChart"), {
        type: "line",
        data: {
            labels: ["Sprint 1", "Sprint 2", "Sprint 3", "Sprint 4"],
            datasets: [{
                label: "Story Points",
                data: [10, 15, 22, 30],
                borderColor: "#2563eb",
                fill: false,
                tension: 0.3
            }]
        }
    });
}

function logout() {
    localStorage.removeItem("isLoggedIn");
    window.location.href = "index.html";
}

loadDashboard();
</script>

</body>
</html>
